services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobs_portal
      MYSQL_USER: jobs_user
      MYSQL_PASSWORD: Jobs@12345
      MYSQL_ROOT_PASSWORD: Root@12345
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
